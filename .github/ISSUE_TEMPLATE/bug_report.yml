name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, code snippets, screenshots, or reproduction steps that demonstrate the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: proposed_approach
    attributes:
      label: Proposed approach
      description: How do you suggest we fix this?
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: What defines this issue as done?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: false