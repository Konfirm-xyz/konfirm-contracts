name: Feature Request
description: Suggest an enhancement or new feature for the project
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the feature or enhancement you'd like.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Any supporting context — use cases, user feedback, competitor analysis, or screenshots that motivate this request.
    validations:
      required: true

  - type: textarea
    id: proposed_approach
    attributes:
      label: Proposed approach
      description: How do you suggest we implement this?
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: What defines this feature as complete?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: false