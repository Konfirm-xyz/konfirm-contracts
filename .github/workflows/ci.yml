name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repository Actions permission hardening (see issue #99):
# The repo-level Actions permissions must not allow arbitrary third-party
# actions. Configure via the API/settings (not code):
#   gh api -X PUT repos/Konfirm-xyz/konfirm-contracts/actions/permissions \
#     -f allowed_actions=selected \
#     -f 'selected_actions={...}'
# Allowlist the actions actually used below:
#   - actions/checkout
#   - dtolnay/rust-toolchain
#   - rustsec/audit-check
# Once the companion mutable-tag-pinning issue is resolved, also enable
# sha_pinning_required=true so only SHA-pinned actions may run.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Repo hygiene: keep delete_branch_on_merge enabled so merged PR head
  # branches are auto-deleted instead of accumulating. Idempotent — only
  # touches this single setting, leaving merge/rebase/auto-merge and branch
  # protection untouched.
  repo-hygiene:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Enable delete_branch_on_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH repos/${{ github.repository }} \
            -F delete_branch_on_merge=true
          gh api repos/${{ github.repository }} --jq .delete_branch_on_merge
