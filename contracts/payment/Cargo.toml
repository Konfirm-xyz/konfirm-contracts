[package]
name = "konfirm-payment"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=27.0.5"
konfirm-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { version = "=27.0.5", features = ["testutils"] }
# Needed only to register ComplianceContract alongside PaymentContract in a
# same-Env integration test (issue #254). payment calls compliance by
# runtime Address, not a Cargo dependency, so this is test-only.
konfirm-compliance = { path = "../compliance" }

[features]
testutils = ["soroban-sdk/testutils"]
